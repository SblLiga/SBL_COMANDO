  </defs>
  <circle cx="32" cy="32" r="30" fill="#0a0a0a" stroke="#C5A880" stroke-width="3"/>
  <image href="/logo.png" x="2" y="2" width="60" height="60" clip-path="url(#c)" preserveAspectRatio="xMidYMid slice"/>
</svg>
