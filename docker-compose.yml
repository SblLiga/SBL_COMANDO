# Local development stack for SBL_COMANDO (FastAPI + PostgreSQL)
# Usage:
#   docker compose up --build
#   curl http://localhost:8000/health

services:
  db:
    image: postgres:15-alpine
    container_name: sbl_local_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sbl_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sbl_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sbl_admin} -d ${POSTGRES_DB:-sbl_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sbl_local_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      LOG_LEVEL: DEBUG
      PORT: 80
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sbl_dev}
      DB_USER: ${POSTGRES_USER:-sbl_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      DB_SSLMODE: disable
      RUN_DB_MIGRATIONS: "true"
      SEED_DEV_DATA: "true"
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-Admin123!}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
